name: CI

# Each pull request, each push to main, and each release (release.yml),
# which drafts nothing until this passes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# Actions are pinned to the commit of a release, so a moved tag can't change
# what runs here. To move to a newer release, change the commit and its
# comment together.

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all --all-features --locked
      # New type files count too, so this asks git status rather than git diff.
      - name: The web app's types, and the graph's API document, match the code
        run: |
          git status --porcelain web/src/api/gen docs/graph-api.json
          test -z "$(git status --porcelain web/src/api/gen docs/graph-api.json)"

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build

  # kelve on Windows and macOS: it builds, and its tests pass.
  platforms:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-14 }
    runs-on: ${{ matrix.os }}
    # A test that hangs fails here, with its log, rather than at GitHub's
    # six hours, without one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --all --locked
      # The Windows installer reads as PowerShell: the release installs
      # with it, once there's one (release.yml).
      - name: install.ps1 reads
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }

  # kelve as people use it, in a browser, against a kelve built from this
  # checkout, with a stand-in for the person's agent, the stand-in shared
  # graph, and a fresh store: web/e2e.
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
      - run: cargo build -p kelve --locked
      - run: cargo build -p kelve-graph-api --features stand-in --bin kelve-graph-stand-in --locked
      - run: bunx playwright install --with-deps chromium webkit
        working-directory: web
      - run: bun run e2e
        working-directory: web
      - name: What the tests saw, when they fail
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e
          path: |
            web/test-results
            web/playwright-report
            web/e2e/.server.log
            web/e2e/.graph.log
          retention-days: 7

  # How kelve looks: every state of every screen, drawn from the example,
  # compared with the screenshots in web/e2e/looks, in Playwright's own
  # image, where they were taken. No kelve needed: the example answers
  # itself.
  looks:
    name: How it looks
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Playwright's image has no unzip, which setting Bun up needs.
      - run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
      - run: node node_modules/@playwright/test/cli.js test -c playwright.looks.config.ts
        working-directory: web
      - name: Both screenshots, when they differ
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: looks
          path: |
            web/test-results
            web/looks-report
          retention-days: 7
