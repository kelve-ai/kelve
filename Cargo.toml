[workspace]
members = [
    "crates/core",
    "crates/store",
    "crates/server",
    "crates/cli",
    "crates/engine",
    "crates/graph-api",
]
resolver = "3"

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/kelve-ai/kelve"
homepage = "https://kelve.ai"

[workspace.dependencies]
kelve-core = { path = "crates/core" }
kelve-store = { path = "crates/store" }
kelve-server = { path = "crates/server" }
kelve-engine = { path = "crates/engine" }
kelve-graph-api = { path = "crates/graph-api" }

# Runtime and HTTP
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8.9", features = ["macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "limit", "timeout", "compression-gzip", "set-header"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form", "query"] }
tokio-stream = { version = "0.1", features = ["sync"] }
http-body-util = "0.1"
futures = "0.3"
url = "2"

# Database
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite-bundled",
    "uuid",
    "chrono",
    "migrate",
    "macros",
    "json",
] }

# Data
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
regex = "1"
# Line diffs for the lines a piece of work changed.
similar = "3"
# The shared graph's OpenAPI document, from the types its API speaks.
utoipa = "6.0.0"
ts-rs = { version = "12", features = ["chrono-impl", "uuid-impl", "serde-json-impl", "no-serde-warnings"] }

# Crypto
sha2 = "0.11"
hmac = "0.13"
getrandom = "0.4"
base64 = "0.23"
# Reading tokens: the VOPRF of RFC 9497, as Privacy Pass issues tokens.
voprf = { version = "0.5", default-features = false, features = ["ristretto255-ciphersuite", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
chacha20poly1305 = "0.11"

# Unpacking a release, for `kelve update`: a .tar.gz on macOS and Linux,
# a .zip on Windows, each holding the one binary. flate2 was already built
# in, for gzip; tar and zip only read, with no other formats.
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# Errors and logs
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Command line
clap = { version = "4", features = ["derive", "env"] }
anstream = "1"
anstyle = "1"
# Reading keys for setup's choices, on macOS, Linux and Windows alike.
# use-dev-tty reads them with poll, not kqueue: the installer gives setup
# /dev/tty, which macOS's kqueue can't watch.
crossterm = { version = "0.29", features = ["use-dev-tty"] }


[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"

# Debug info goes in one packed file per binary. Left unpacked (macOS's
# default), it stays in object files that incremental builds never delete:
# each edit leaves more behind, and target/ grew past 80 GB a worktree.
# Line tables keep file and line in backtraces, and keep linking quick.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
