[package]
name = "kelve-graph-api"
description = "The shared knowledge graph's open API: its shapes, and the one client for it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# A graph that lives in memory, speaking the same API, for tests.
stand-in = ["dep:axum"]
# The API's OpenAPI document (`openapi::document`).
openapi = ["dep:utoipa", "kelve-core/openapi"]

[dependencies]
kelve-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
voprf = { workspace = true }
rand_core = { workspace = true }
axum = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
axum = { workspace = true }

[lints]
workspace = true

# The stand-in graph on its own: `cargo run -p kelve-graph-api --features
# stand-in --bin kelve-graph-stand-in`.
[[bin]]
name = "kelve-graph-stand-in"
required-features = ["stand-in"]
