[package]
name = "kelve-engine"
description = "kelve's engine: reading changes from git's own files, and files with their secrets masked, without running anything."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kelve-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
similar = { workspace = true }
# Walking a folder as git would: .gitignore and the like.
ignore = "0.4.33"
# Reading git itself, never running it: pure Rust, read-only use.
gix = { version = "0.90", default-features = false, features = ["revision", "sha1"] }

[dev-dependencies]
uuid = { workspace = true }

[lints]
workspace = true
