[package]
name = "kelve-engine"
description = "kelve's engine: reading what the person opens, folders, files and changes, into passages, without running anything."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kelve-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
similar = { workspace = true }
# Walking a folder as git would: .gitignore and the like.
ignore = "0.4.33"
# Reading git itself, never running it: pure Rust, read-only use.
gix = { version = "0.90", default-features = false, features = ["revision", "sha1"] }
# Passages of code, by the shape of the code. Grammars are compiled in, so
# nothing is fetched or run.
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
# Passages of prose, by the sections of markdown.
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
uuid = { workspace = true }

[lints]
workspace = true
