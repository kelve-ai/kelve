[package]
name = "ledger"
version = "0.3.0"
edition = "2024"
description = "A payments service that keeps every movement of money as an entry in a ledger, and never charges twice."

[dependencies]
axum = "0.8"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
